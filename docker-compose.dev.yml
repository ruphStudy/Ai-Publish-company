version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: ai-publishing-mongodb-dev
    ports:
      - '27017:27017'
    volumes:
      - mongodb_dev_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_publishing_dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-publishing-dev-network

  redis:
    image: redis:7-alpine
    container_name: ai-publishing-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ai-publishing-dev-network

  minio:
    image: minio/minio:latest
    container_name: ai-publishing-minio-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_dev_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-publishing-dev-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: ai-publishing-api-dev
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/ai_publishing_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
    command: pnpm --filter @ai-publishing/api dev
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ai-publishing-dev-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: ai-publishing-web-dev
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    command: pnpm --filter @ai-publishing/web dev
    depends_on:
      - api
    networks:
      - ai-publishing-dev-network

volumes:
  mongodb_dev_data:
  redis_dev_data:
  minio_dev_data:

networks:
  ai-publishing-dev-network:
    driver: bridge
